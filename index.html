<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KEEP — The Group, Working Together</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f7f4;--surface:#fff;--surface2:#f1f0ed;--border:#e2e0db;--border2:#ccc;
  --text:#1a1a18;--text2:#555;--text3:#888;
  --blue:#185FA5;--blue-bg:#E6F1FB;--blue-light:#B5D4F4;
  --green:#3B6D11;--green-bg:#EAF3DE;--green-light:#C0DD97;
  --amber:#854F0B;--amber-bg:#FAEEDA;--amber-light:#FAC775;
  --red:#A32D2D;--red-bg:#FCEBEB;--red-light:#F7C1C1;
  --purple:#3C3489;--purple-bg:#EEEDFE;--purple-light:#CECBF6;
  --teal:#0F6E56;--teal-bg:#E1F5EE;--teal-light:#9FE1CB;
  --radius:8px;--radius-lg:12px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;min-height:100vh}
a{color:var(--blue)}
button{cursor:pointer;font-family:inherit;font-size:13px}
input,select,textarea{font-family:inherit;font-size:13px;border:1px solid var(--border2);border-radius:var(--radius);padding:7px 10px;width:100%;outline:none;background:var(--surface);color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
label{font-size:12px;color:var(--text2);display:block;margin-bottom:4px;font-weight:500}
textarea{resize:vertical;min-height:70px}

/* Layout */
.app{display:flex;min-height:100vh}
.sidebar{width:220px;min-width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:0}
.sidebar-logo{padding:20px 18px 14px;border-bottom:1px solid var(--border)}
.sidebar-logo h1{font-size:15px;font-weight:600;color:var(--text)}
.sidebar-logo p{font-size:11px;color:var(--text3);margin-top:2px}
.sidebar-nav{padding:10px 8px;flex:1}
.nav-section{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;padding:10px 10px 4px}
.nav-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--radius);cursor:pointer;color:var(--text2);font-size:13px;border:none;background:none;width:100%;text-align:left;margin-bottom:1px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--blue-bg);color:var(--blue);font-weight:500}
.nav-item svg{width:16px;height:16px;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:12px 16px;border-top:1px solid var(--border)}
.role-badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:5px 10px;border-radius:20px;background:var(--purple-bg);color:var(--purple)}

.main{flex:1;overflow-x:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;justify-content:space-between}
.topbar h2{font-size:17px;font-weight:600}
.topbar-actions{display:flex;gap:8px;align-items:center}
.content{padding:24px 28px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius);border:1px solid var(--border2);background:var(--surface);color:var(--text);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn-primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.btn-primary:hover{background:#0c447c}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-danger{background:var(--red-bg);color:var(--red);border-color:var(--red-light)}
.btn-success{background:var(--green-bg);color:var(--green);border-color:var(--green-light)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px}
.card-sm{padding:14px 16px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.stat-card{background:var(--surface2);border-radius:var(--radius);padding:14px 16px}
.stat-label{font-size:11px;color:var(--text3);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.stat-value{font-size:24px;font-weight:600;color:var(--text)}
.stat-sub{font-size:11px;color:var(--text3);margin-top:2px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;padding:3px 8px;border-radius:20px;white-space:nowrap}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-amber{background:var(--amber-bg);color:var(--amber)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-purple{background:var(--purple-bg);color:var(--purple)}
.badge-teal{background:var(--teal-bg);color:var(--teal)}
.badge-gray{background:var(--surface2);color:var(--text2)}

/* Tables */
.table-wrap{overflow-x:auto;border-radius:var(--radius-lg);border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--surface)}
th{background:var(--surface2);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text3);padding:10px 14px;text-align:left;border-bottom:1px solid var(--border)}
td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafaf8}

/* Forms */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-group{margin-bottom:14px}
.form-row{display:flex;gap:14px}
.form-row .form-group{flex:1}

/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);padding:24px;width:620px;max-width:95vw;max-height:90vh;overflow-y:auto;position:relative}
.modal h3{font-size:16px;font-weight:600;margin-bottom:18px}
.modal-close{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:18px;line-height:1}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}

/* Tabs */
.tabs{display:flex;gap:2px;background:var(--surface2);border-radius:var(--radius);padding:3px;margin-bottom:20px;width:fit-content}
.tab{padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none}
.tab.active{background:var(--surface);color:var(--text)}

/* Alerts */
.alert{padding:12px 16px;border-radius:var(--radius);font-size:13px;margin-bottom:16px;display:flex;align-items:flex-start;gap:10px}
.alert-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-light)}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-light)}
.alert-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-light)}
.alert-blue{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-light)}

/* Timeline */
.timeline{padding-left:24px;border-left:2px solid var(--border)}
.tl-item{position:relative;padding-bottom:16px;padding-left:16px}
.tl-dot{position:absolute;left:-25px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid var(--surface)}
.tl-date{font-size:11px;color:var(--text3)}
.tl-text{font-size:13px;color:var(--text);margin-top:2px}

/* Fine calc */
.fine-display{background:var(--red-bg);border:1px solid var(--red-light);border-radius:var(--radius);padding:14px;text-align:center}
.fine-amount{font-size:28px;font-weight:700;color:var(--red)}
.fine-label{font-size:12px;color:var(--red);margin-top:4px}

/* Progress bar */
.progress{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;background:var(--blue)}

/* Search */
.search-bar{display:flex;gap:8px;align-items:center;margin-bottom:18px}
.search-bar input{max-width:280px}
.search-bar select{max-width:160px}

/* Empty state */
.empty{text-align:center;padding:48px 20px;color:var(--text3)}
.empty svg{width:40px;height:40px;opacity:.3;margin:0 auto 12px;display:block}

/* Role selector */
.role-selector{padding:20px;border-bottom:1px solid var(--border)}
.role-selector label{font-size:11px;color:var(--text3);margin-bottom:6px;font-weight:600;text-transform:uppercase}
.role-selector select{font-size:12px}

/* Notification dot */
.notif-dot{width:7px;height:7px;background:#e24b4a;border-radius:50%;display:inline-block;margin-left:auto}

/* Responsive tweaks */
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}.sidebar{width:190px;min-width:190px}}
</style>
</head>

<div class="app">

<!-- Sidebar -->

<script>
// ── API CONFIG ────────────────────────────────────────────────────────────
const API_URL = 'https://script.google.com/macros/s/AKfycbwnCXMjKnS6F8TJ05kdtpD-5EElmmtCkwRCueKup_7mtcKhWdF_XW5Vacce4NrDEQfp/exec';

async function apiRead(sheet) {
  const url = `${API_URL}?action=read&sheet=${sheet}&t=${Date.now()}`;
  const r = await fetch(url);
  const j = await r.json();
  return j.rows || [];
}

async function apiWrite(sheet, data) {
  const url = `${API_URL}?action=write&sheet=${sheet}&data=${encodeURIComponent(JSON.stringify(data))}`;
  const r = await fetch(url);
  return await r.json();
}

async function apiUpdate(sheet, id, data) {
  const url = `${API_URL}?action=update&sheet=${sheet}&id=${encodeURIComponent(id)}&data=${encodeURIComponent(JSON.stringify(data))}`;
  const r = await fetch(url);
  return await r.json();
}

async function apiInit() {
  const url = `${API_URL}?action=init`;
  const r = await fetch(url);
  return await r.json();
}

function showLoader(msg) {
  let el = document.getElementById('globalLoader');
  if (!el) {
    el = document.createElement('div');
    el.id = 'globalLoader';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;background:var(--blue);color:#fff;text-align:center;padding:10px;font-size:13px;font-weight:500;z-index:999;transition:opacity .3s';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  el.style.display = 'block';
}

function hideLoader() {
  const el = document.getElementById('globalLoader');
  if (el) { el.style.opacity = '0'; setTimeout(() => el.style.display='none', 300); }
}

function showError(msg) {
  const el = document.getElementById('globalLoader');
  if (el) {
    el.style.background = 'var(--red)';
    el.textContent = '⚠ ' + msg;
    el.style.opacity = '1';
    el.style.display = 'block';
    setTimeout(() => { el.style.background='var(--blue)'; hideLoader(); }, 4000);
  }
}

// ── DATA ──────────────────────────────────────────────────────────────────
const COMPANIES = [
  "Asec Engineering","Asec Automation ASA","ARESCO","ASCOM","United for Foundries UCF",
  "GlassRock","OSTOOL","NPM","Taqa Gas","Taqa Power","Taqa Petroleum",
  "Taqa Water","Dina Farms","ERC","ACCM","Qalaa","GP Business Development"
];

// Global modal state for safe onclick handlers
let currentModalRefId = '';
let currentModalDueId = '';

function viewReferralSafe(btn){ viewReferral(btn.getAttribute('data-id')); }
function viewDueSafe(btn){ viewDue(btn.getAttribute('data-id')); }
function markPaidSafe(btn){ markPaid(btn.getAttribute('data-id')); }
function completeSourcingSafe(btn){ completeSourcing(btn.getAttribute('data-id')); }

function rejectReferralSafe(btn){ rejectReferral(btn.getAttribute('data-id')); renderApprovals(); }
function editContactSafe(btn){ editContact(decodeURIComponent(btn.getAttribute('data-co'))); }
function saveContactModal(){ saveContact(document.getElementById('ecCompanyId').value); }

// ── CONTACTS (editable per company) ───────────────────────────────────────
let CONTACTS_RAW = [];
const CONTACTS = {
  "Asec Engineering":        {name:'',phone:'',email:''},
  "Asec Automation ASA":     {name:'',phone:'',email:''},
  "ARESCO":                  {name:'',phone:'',email:''},
  "ASCOM":                   {name:'',phone:'',email:''},
  "United for Foundries UCF":{name:'',phone:'',email:''},
  "GlassRock":               {name:'',phone:'',email:''},
  "OSTOOL":                  {name:'',phone:'',email:''},
  "NPM":          {name:'',phone:'',email:''},
  "Taqa Gas":                {name:'',phone:'',email:''},
  "Taqa Power":              {name:'',phone:'',email:''},
  "Taqa Petroleum":          {name:'',phone:'',email:''},
  "Taqa Water":              {name:'',phone:'',email:''},
  "Dina Farms":              {name:'',phone:'',email:''},
  "ERC":                     {name:'',phone:'',email:''},
  "ACCM":                    {name:'',phone:'',email:''},
  "Qalaa":                   {name:'',phone:'',email:''},
  "GP Business Development": {name:'',phone:'',email:''},
};

// ── DUES REGISTER ────────────────────────────────────────────────────────
let DUES = [];

function getContact(co){
  const c = CONTACTS_RAW.find(r=>r.company===co);
  if(!c) return {name:'',phone:'',email:''};
  return {name:String(c.name||''),phone:String(c.phone||''),email:String(c.email||'')};
}

// ── BD DIRECTOR (always notified) ─────────────────────────────────────────
const BD_DIRECTOR = {
  name:  'Hossam Negm',
  email: 'hossam.negm@asec-holding.com',
  phone: '+201222845454'
};
const TOOL_URL = 'https://qalaaholdings.github.io/qalaa-framework/';

function waLink(phone,msg){
  const clean=String(phone||'').replace(/\D/g,'');
  if(!clean) return '#';
  return `https://wa.me/${clean}?text=${encodeURIComponent(msg)}`;
}

function notifyPanel(companies, subject, msgBody){
  if(!companies||companies.length===0) return '';

  // Always include BD Director row
  const bdEmailBtn=`<a href="mailto:${BD_DIRECTOR.email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(msgBody)}" class="btn btn-sm" style="text-decoration:none" title="Email ${BD_DIRECTOR.name}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg> Email</a>`;
  const bdWABtn=`<a href="${waLink(BD_DIRECTOR.phone,msgBody)}" target="_blank" class="btn btn-sm" style="text-decoration:none;background:var(--purple-bg);color:var(--purple);border-color:var(--purple-light)" title="WhatsApp ${BD_DIRECTOR.name}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px"><path d="M21 11.5a8.38 8.38 0 01-.9 3.8 8.5 8.5 0 01-7.6 4.7 8.38 8.38 0 01-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 01-.9-3.8 8.5 8.5 0 014.7-7.6 8.38 8.38 0 013.8-.9h.5a8.48 8.48 0 018 8v.5z"/></svg> WhatsApp</a>`;
  const bdRow=`<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--blue-light);background:var(--purple-bg);margin:0 -14px;padding-left:14px;padding-right:14px">
    <span style="font-size:12px;font-weight:600;color:var(--purple)">★ ${BD_DIRECTOR.name} <span style="font-weight:400;color:var(--purple);opacity:.7">— Group BD Director</span></span>
    <div style="display:flex;gap:6px">${bdEmailBtn}${bdWABtn}</div>
  </div>`;

  const rows=companies.filter(Boolean).map(co=>{
    const c=getContact(co);
    const hasEmail=c.email&&String(c.email).trim();
    const hasPhone=c.phone&&String(c.phone).trim();

function today(){ return new Date().toISOString().split('T')[0] }
function fmt(n){ return 'EGP '+n.toLocaleString() }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}) }
function daysDiff(d){ const ms=new Date()-new Date(d); return Math.floor(ms/86400000) }

function calcFine(amount, dueDate){
  if(!dueDate) return 0;
  const days = daysDiff(dueDate);
  if(days<=0) return 0;
  const daily=amount*0.0005;
  const fine=Math.min(daily*days, amount*0.10);
  return Math.round(fine);
}

function getStatusBadge(s){
  const map={
    'Pending approval':     '<span class="badge badge-amber">Pending approval</span>',
    'approved':             '<span class="badge badge-blue">Approved</span>',
    'Under negotiation':    '<span class="badge badge-blue">Under negotiation</span>',
    'In negotiation':       '<span class="badge badge-blue">Under negotiation</span>',
    'Apology':              '<span class="badge badge-red">Apology</span>',
    'Failed technically':   '<span class="badge badge-red">Failed technically</span>',
    'Failed commercially':  '<span class="badge badge-red">Failed commercially</span>',
    'Secured':              '<span class="badge badge-teal">Secured</span>',
    'Signed':               '<span class="badge badge-purple">Signed</span>',
    'Completed':            '<span class="badge badge-green">Completed</span>',
    'Rejected':             '<span class="badge badge-red">Rejected</span>',
    'In progress':          '<span class="badge badge-teal">In progress</span>',
    'Pending response':     '<span class="badge badge-amber">Pending response</span>',
    'Overdue':              '<span class="badge badge-red">Overdue</span>',
    'Paid':                 '<span class="badge badge-green">Paid</span>',
  };
  return map[s]||`<span class="badge badge-gray">${s}</span>`;
}

  document.getElementById('topbarActions').innerHTML='';

  const rows=payable.map(r=>{

    const statusLabel=outstanding<=0?'Paid':overdue?'Overdue':'Due';
    return `<tr>
      <td><strong>${r.id}</strong><br><span style="font-size:12px;color:var(--text3)">${r.client}</span></td>

  }).join('');

  const totalIncentive=Math.round(payable.reduce((a,r)=>a+r.collected*0.005,0));
  const totalPaid=payable.reduce((a,r)=>a+r.incentivePaid,0);
  const totalOutstanding=totalIncentive-totalPaid;
  const totalFines=payable.reduce((a,r)=>{
    const out=Math.round(r.collected*0.005)-r.incentivePaid;
    return a+(out>0&&r.paymentDue?calcFine(out,r.paymentDue):0);
  },0);

  document.getElementById('mainContent').innerHTML=`
    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr)">
      <div class="stat-card"><div class="stat-label">Total incentives due</div><div class="stat-value" style="font-size:18px">${fmt(totalIncentive)}</div></div>

      <div class="stat-card"><div class="stat-label">Outstanding</div><div class="stat-value" style="font-size:18px;color:var(--amber)">${fmt(totalOutstanding)}</div></div>

      </table>
    </div>
  `;
}





// ── FINES (calc helper only) ──────────────────────────────────────────────
function calcFineDisplay(){
  const amt=parseFloat(document.getElementById('fcAmt').value)||0;
  const due=document.getElementById('fcDue').value;
  if(!amt||!due){ document.getElementById('fineResult').innerHTML=''; return; }
  const days=daysDiff(due);
  if(days<=0){ document.getElementById('fineResult').innerHTML='<div class="alert alert-green">Payment is not yet overdue.</div>'; return; }
  const fine=calcFine(amt,due);
  document.getElementById('fineResult').innerHTML='<div class="fine-display"><div class="fine-amount">'+fmt(fine)+'</div><div class="fine-label">Fine accrued over '+days+' day'+(days>1?'s':'')+'</div></div>';
}

// ── DUES ──────────────────────────────────────────────────────────────────
function dueStatusBadge(s){
  const map={'Pending response':'<span class="badge badge-amber">Pending response</span>','Acknowledged':'<span class="badge badge-blue">Acknowledged</span>','Disputed':'<span class="badge badge-red">Disputed</span>','Partially settled':'<span class="badge badge-teal">Partially settled</span>','Fully settled':'<span class="badge badge-green">Fully settled</span>'};
  return map[s]||'<span class="badge badge-gray">'+s+'</span>';
}

function renderDues(){
  const isKeeper=currentRole==='keeper';
  document.getElementById('topbarActions').innerHTML='<button class="btn btn-primary btn-sm" onclick="openNewDueModal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Register overdue</button>';
  const visibleDues=DUES;
  const totalDues=DUES.reduce(function(a,d){return a+(d.amount-d.settled);},0);
  const pending=DUES.filter(function(d){return d.status==='Pending response';}).length;
  const disputed=DUES.filter(function(d){return d.status==='Disputed';}).length;
  let rows='';
  visibleDues.forEach(function(d){

    const overdueDays=Math.max(0,daysDiff(d.dueDate));

    const dayColor=overdueDays>0?'var(--red)':'var(--green)';
    const dayLabel=overdueDays>0?overdueDays+' days overdue':'On time';
    rows+='<tr><td><span style="font-size:11px;color:var(--text3)">'+d.id+'</span><br><strong>'+d.creditor+'</strong><br><span style="font-size:11px;color:var(--text3)">owed by</span><br><strong style="color:var(--red)">'+d.debtor+'</strong></td><td style="font-size:12px">'+d.desc+'</td><td style="font-size:12px">'+fmt(d.amount)+'</td><td style="font-size:12px;color:var(--green)">'+(d.settled>0?fmt(d.settled):'—')+'</td><td style="font-size:12px;color:'+outColor+'"><strong>'+fmt(outstanding)+'</strong></td><td style="font-size:12px">'+fmtDate(d.dueDate)+'<br><span style="color:'+dayColor+';font-size:11px">'+dayLabel+'</span></td><td>'+dueStatusBadge(d.status)+'</td><td><button class="btn btn-sm" onclick="viewDueSafe(this)" data-id="'+d.id+'">View</button></td></tr>';
  });
  const alertHtml=(pending>0?'<div class="alert alert-amber" style="margin-bottom:16px"><strong>'+pending+' overdue(s)</strong> awaiting debtor response.</div>':'')+(disputed>0?'<div class="alert alert-red" style="margin-bottom:16px"><strong>'+disputed+' overdue(s)</strong> disputed.</div>':'');
  document.getElementById('mainContent').innerHTML=
    alertHtml+
    '<div class="stats-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:20px"><div class="stat-card"><div class="stat-label">Total registered</div><div class="stat-value">'+DUES.length+'</div></div><div class="stat-card"><div class="stat-label">Total outstanding</div><div class="stat-value" style="font-size:17px;color:var(--red)">'+fmt(totalDues)+'</div></div><div class="stat-card"><div class="stat-label">Pending response</div><div class="stat-value" style="color:var(--amber)">'+pending+'</div></div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Creditor / Debtor</th><th>Description</th><th>Amount</th><th>Settled</th><th>Outstanding</th><th>Due date</th><th>Status</th><th></th></tr></thead><tbody>'+(rows||'<tr><td colspan="8" style="text-align:center;color:var(--text3);padding:24px">No overdues registered yet</td></tr>')+'</tbody></table></div>';
}

async function respondDue(id,responseType){
  const d=DUES.find(function(x){return x.id===id;});
  if(!d) return;
  const response=document.getElementById('dueResponse').value.trim();
  if(!response){showToast('Please enter your response first','error');return;}
  d.status=responseType; d.debtorResponse=response;
  showLoader('Saving\u2026'); await apiUpdate('Dues',d.id,d); hideLoader();
  closeModal(); renderDues(); showToast('Response recorded');
}

async function settleDue(id){
  const d=DUES.find(function(x){return x.id===id;});
  if(!d) return;
  const amt=parseFloat(document.getElementById('dueSettleAmt').value)||0;
  const date=document.getElementById('dueSettleDate').value;
  if(!amt){showToast('Please enter settlement amount','error');return;}
  d.settled=Math.min(parseFloat(d.settled)+amt,parseFloat(d.amount));
  d.settlementDate=date;
  d.status=d.settled>=parseFloat(d.amount)?'Fully settled':'Partially settled';
  showLoader('Saving\u2026'); await apiUpdate('Dues',d.id,d); hideLoader();

  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(srcData),'Sourcing');
  const custData=CUSTOMERS.map(function(c){return {'ID':c.id,'Customer':c.customerName,'Sector':c.sector,'Country':c.country,'Registered By':c.registeredBy,'Payment':c.ratingPayment,'Communication':c.ratingComm,'Professionalism':c.ratingProf,'Growth':c.ratingGrowth,'Overall':c.ratingOverall};});

  XLSX.writeFile(wb,'KEEP_Report_'+today()+'.xlsx');
  showToast('Excel report downloaded');

  const r=ROFM.find(function(x){return x.id===id;});

  const isKeeper=currentRole==='keeper';
  const daysLeft=Math.ceil((new Date(r.matchDeadline)-new Date())/(1000*60*60*24));
  const expired=daysLeft<=0;
  const canMatchBtn=r.status==='Open'?'<button class="btn btn-success" onclick="respondROFMSafe(this.dataset.id,this.dataset.ans)" data-id="'+id+'" data-ans="Matched">✓ We can match this price</button><button class="btn btn-danger" style="margin-left:8px" onclick="respondROFMSafe(this.dataset.id,this.dataset.ans)" data-id="'+id+'" data-ans="Cannot match">✕ Cannot match</button>':'';
  const bdApproveBtn=isKeeper&&r.status==='Pending BD approval'?
    '<div style="background:var(--amber-bg);border:1px solid var(--amber-light);border-radius:var(--radius);padding:14px;margin-top:12px">'+
    '<p style="font-size:13px;color:var(--amber);font-weight:600;margin-bottom:10px">No group company matched — awaiting your approval to go external.</p>'+
    '<div style="display:flex;gap:8px">'+
    '<button class="btn btn-danger" onclick="approveExternalSafe(this.dataset.id)" data-id="'+id+'">Approve going external</button>'+
    '<button class="btn btn-primary" onclick="sendBackROFMSafe(this.dataset.id)" data-id="'+id+'">Send back for re-negotiation</button>'+
    '</div></div>':'';

  const responsesHtml=r.responses?(function(){
    let h='<div style="margin-top:12px"><h4 style="font-size:13px;font-weight:600;margin-bottom:10px">Company responses</h4>';
    try{
      const resp=JSON.parse(r.responses);
      resp.forEach(function(res){
        const badge=res.answer==='Matched'?'badge-green':res.answer==='Cannot match'?'badge-red':'badge-amber';
        h+='<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:13px">'+res.company+'</span><span class="badge '+badge+'">'+res.answer+'</span></div>';
      });
    }catch(e){}
    return h+'</div>';
  })():'';

  const subject='KEEP — Right of First Match: '+r.serviceDesc;
  const msg='Dear Contact,\n\nA Right of First Match opportunity is available.\n\nRequesting company: '+r.requestingCompany+'\nService required: '+r.serviceDesc+'\nExternal quote: '+fmt(parseFloat(r.externalQuote)||0)+'\nExternal supplier: '+r.externalSupplier+'\nMatch deadline: '+r.matchDeadline+'\n\nPlease log in to respond:\n👉 https://qalaaholdings.github.io/qalaa-framework/\n\nKEEP — The Group, Working Together';

  openModal(
    '<h3>Right of First Match — '+r.id+'</h3>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">'+
    '<div class="stat-card"><div class="stat-label">Requesting company</div><div style="font-weight:600;margin-top:4px">'+r.requestingCompany+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">External supplier</div><div style="font-weight:600;margin-top:4px">'+r.externalSupplier+'</div></div>'+
    '<div class="stat-card"><div class="stat-label">External quote</div><div style="font-size:20px;font-weight:700;color:var(--red);margin-top:4px">'+fmt(parseFloat(r.externalQuote)||0)+'</div></div>'+
    (function(){var dc=expired?'var(--red)':'var(--text)';var dl=r.status==='Open'?' ('+Math.abs(daysLeft)+(expired?' days overdue':' days left')+')':'';return '<div class="stat-card"><div class="stat-label">Match deadline</div><div style="font-weight:600;margin-top:4px;color:'+dc+'">'+fmtDate(r.matchDeadline)+dl+'</div></div>';})()+
    '</div>'+
    '<div class="form-group"><label>Service / product required</label><p style="font-size:13px;color:var(--text2);padding:8px 10px;background:var(--surface2);border-radius:var(--radius)">'+r.serviceDesc+'</p></div>'+
    (r.notes?'<div class="form-group"><label>Additional notes</label><p style="font-size:13px;color:var(--text2);padding:8px 10px;background:var(--surface2);border-radius:var(--radius)">'+r.notes+'</p></div>':'')+
    responsesHtml+
    (r.status==='Open'&&canMatchBtn?'<div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap">'+canMatchBtn+'</div>':'')+
    bdApproveBtn+
    notifyPanel(COMPANIES.slice(0,3),subject,msg)+
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Close</button></div>'
  );
}

async function respondROFMSafe(btnOrId, answer){
  const id=typeof btnOrId==="string"?btnOrId:btnOrId.getAttribute("data-id");
  if(!answer&&typeof btnOrId!=="string") answer=btnOrId.getAttribute("data-ans");
  const r=ROFM.find(function(x){return x.id===id;});
  if(!r) return;
  let responses=[];
  try{ responses=JSON.parse(r.responses||'[]'); }catch(e){}
  const company=COMPANIES[0]; // In real use, company would be logged-in user
  responses.push({company:company,answer:answer,date:today()});
  r.responses=JSON.stringify(responses);
  if(answer==='Matched') r.status='Matched';
  showLoader('Saving response…');
  await apiUpdate('ROFM',id,r);
  hideLoader();
  closeModal();
  renderSourcing('rofm');
  showToast(answer==='Matched'?'Matched! Internal company wins.':'Response recorded');
}

async function approveExternalSafe(btnOrId){
  const id=typeof btnOrId==="string"?btnOrId:btnOrId.getAttribute("data-id");
  const r=ROFM.find(function(x){return x.id===id;});
  if(!r) return;
  r.status='Approved external';
  r.bdApprovalDate=today();
  showLoader('Saving approval…');
  await apiUpdate('ROFM',id,r);
  hideLoader();
  const subject='KEEP — External Purchase Approved: '+r.serviceDesc;
  const msg='Dear Contact,\n\nThe Group BD Director has approved proceeding with the external supplier for the following:\n\nService: '+r.serviceDesc+'\nRequesting company: '+r.requestingCompany+'\nExternal supplier: '+r.externalSupplier+'\nApproved amount: '+fmt(parseFloat(r.externalQuote)||0)+'\n\n👉 https://qalaaholdings.github.io/qalaa-framework/\n\nKEEP — The Group, Working Together';
  closeModal();
  openModal('<h3>External purchase approved</h3>'+
    '<div class="alert alert-red"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>Approved to go external. Notify the company below.</div>'+
    notifyPanel([r.requestingCompany],subject,msg)+
    '<div class="modal-footer"><button class="btn btn-primary" onclick="closeModal();renderSourcing(\"rofm\")">Done</button></div>');
  showToast('External purchase approved');
}

async function sendBackROFMSafe(btnOrId){
  const id=typeof btnOrId==="string"?btnOrId:btnOrId.getAttribute("data-id");
  const r=ROFM.find(function(x){return x.id===id;});
  if(!r) return;
  r.status='Open';
  r.matchDeadline=new Date(Date.now()+7*864e5).toISOString().split('T')[0];
  showLoader('Sending back…');
  await apiUpdate('ROFM',id,r);
  hideLoader();
  closeModal();
  renderSourcing('rofm');
  showToast('Sent back — deadline extended by 7 days');
}

async function submitROFM(){
  const company=document.getElementById('rfCompany').value;
  const supplier=document.getElementById('rfSupplier').value.trim();
  const desc=document.getElementById('rfDesc').value.trim();
  const quote=parseFloat(document.getElementById('rfQuote').value)||0;
  const deadline=document.getElementById('rfDeadline').value;
  const notes=document.getElementById('rfNotes').value.trim();
  if(!supplier||!desc||!quote||!deadline){showToast('Please fill all required fields','error');return;}
  const id='RFM-'+String(ROFM.length+1).padStart(3,'0');
  const newR={id,requestingCompany:company,externalSupplier:supplier,serviceDesc:desc,externalQuote:quote,matchDeadline:deadline,notes,status:'Open',responses:'[]',registeredDate:today(),bdApprovalDate:''};
  showLoader('Registering…');
  await apiWrite('ROFM',newR);
  ROFM.push(newR);
  hideLoader();
  const subject='KEEP — Right of First Match: '+desc;
  const msg='Dear Contact,\n\nA Right of First Match request has been registered. You have until '+deadline+' to match the external quote.\n\nRequesting company: '+company+'\nService required: '+desc+'\nExternal supplier: '+supplier+'\nExternal quote: '+fmt(quote)+'\nMatch deadline: '+deadline+'\n\nLog in to respond:\n👉 https://qalaaholdings.github.io/qalaa-framework/\n\nKEEP — The Group, Working Together';
  closeModal();
  openModal('<h3>Quote Registered — '+id+'</h3>'+
    '<div class="alert alert-blue"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>All group companies have been notified and have until <strong>'+fmtDate(deadline)+'</strong> to match.</div>'+
    notifyPanel(COMPANIES,subject,msg)+
    '<div class="modal-footer"><button class="btn btn-primary" onclick="closeModal();renderSourcing(\"rofm\")">Done</button></div>');
  showToast('Right of first match registered');
}

    cards+='<div style="margin-bottom:12px">'+companyBadges+'</div>';
    cards+='<div style="margin-top:10px"><button class="btn btn-sm" onclick="openNewExhibitionModal(\''+encodeURIComponent(eventName)+'\',\''+ev.eventDate+'\',\''+encodeURIComponent(ev.location)+'\',\''+ev.type+'\')">+ My company is also interested</button></div>';

  });

    '<div style="font-size:13px;color:var(--text2)">'+(c.contactName?'<div style="margin-bottom:6px"><strong>'+c.contactName+'</strong></div>':'')+(c.contactTitle?'<div style="margin-bottom:6px;color:var(--text3)">'+c.contactTitle+'</div>':'')+(c.contactEmail?'<div style="margin-bottom:6px"><a href="mailto:'+c.contactEmail+'">'+c.contactEmail+'</a></div>':'')+(c.contactPhone?'<div style="margin-bottom:6px">'+c.contactPhone+'</div>':'')+'</div>'+
    (c.notes?'<div style="margin-top:12px"><h4 style="font-size:13px;font-weight:600;margin-bottom:6px">Notes</h4><p style="font-size:12px;color:var(--text2);background:var(--surface2);padding:8px 10px;border-radius:var(--radius)">'+c.notes+'</p></div>':'')+
    '</div></div>'+
    '<div style="font-size:11px;color:var(--text3);margin-bottom:16px">Registered by <strong>'+c.registeredBy+'</strong> on '+c.registeredDate+'</div>'+
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Close</button></div>'
  );
}

function openNewCustomerModal(){
  const coOpts=COMPANIES.map(function(c){return '<option>'+c+'</option>';}).join('');
  openModal('<h3>Add customer to database</h3>'+
    '<div class="form-row"><div class="form-group"><label>Customer name</label><input type="text" id="cName" placeholder="e.g. Lafarge Egypt"></div><div class="form-group"><label>Sector</label><select id="cSector"><option>Cement</option><option>Steel</option><option>Energy</option><option>Construction</option><option>Mining</option><option>Agriculture</option><option>Food & Beverage</option><option>Government</option><option>Other</option></select></div></div>'+
    '<div class="form-row"><div class="form-group"><label>Country</label><input type="text" id="cCountry" placeholder="e.g. Egypt"></div><div class="form-group"><label>Registered by</label><select id="cRegBy">'+coOpts+'</select></div></div>'+
    '<h4 style="font-size:13px;font-weight:600;margin:14px 0 10px">Contact person</h4>'+
    '<div class="form-row"><div class="form-group"><label>Name</label><input type="text" id="cContactName" placeholder="Contact name"></div><div class="form-group"><label>Title</label><input type="text" id="cContactTitle" placeholder="Job title"></div></div>'+
    '<div class="form-row"><div class="form-group"><label>Email</label><input type="email" id="cContactEmail" placeholder="email@company.com"></div><div class="form-group"><label>Phone</label><input type="tel" id="cContactPhone" placeholder="+20\u2026"></div></div>'+
    '<h4 style="font-size:13px;font-weight:600;margin:14px 0 10px">Ratings (1\u201310)</h4>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div class="form-group"><label>Payment reliability</label><input type="number" id="cRatePay" min="1" max="10" placeholder="1\u201310"></div><div class="form-group"><label>Communication</label><input type="number" id="cRateComm" min="1" max="10" placeholder="1\u201310"></div><div class="form-group"><label>Professionalism</label><input type="number" id="cRateProf" min="1" max="10" placeholder="1\u201310"></div><div class="form-group"><label>Growth potential</label><input type="number" id="cRateGrowth" min="1" max="10" placeholder="1\u201310"></div><div class="form-group"><label>Overall experience</label><input type="number" id="cRateOverall" min="1" max="10" placeholder="1\u201310"></div></div>'+
    '<div class="form-group" style="margin-top:10px"><label>Notes</label><textarea id="cNotes" placeholder="Any important notes\u2026"></textarea></div>'+
    '<div class="modal-footer"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitCustomer()">Add customer</button></div>');
}

async function submitCustomer(){
  const name=document.getElementById('cName').value.trim();
  const country=document.getElementById('cCountry').value.trim();
  if(!name||!country){showToast('Please fill required fields','error');return;}
  const id='CST-'+String(CUSTOMERS.length+1).padStart(3,'0');
  const newC={id,customerName:name,sector:document.getElementById('cSector').value,country,registeredBy:document.getElementById('cRegBy').value,registeredDate:today(),contactName:document.getElementById('cContactName').value.trim(),contactTitle:document.getElementById('cContactTitle').value.trim(),contactEmail:document.getElementById('cContactEmail').value.trim(),contactPhone:document.getElementById('cContactPhone').value.trim(),ratingPayment:parseFloat(document.getElementById('cRatePay').value)||0,ratingComm:parseFloat(document.getElementById('cRateComm').value)||0,ratingProf:parseFloat(document.getElementById('cRateProf').value)||0,ratingGrowth:parseFloat(document.getElementById('cRateGrowth').value)||0,ratingOverall:parseFloat(document.getElementById('cRateOverall').value)||0,notes:document.getElementById('cNotes').value.trim()};
  showLoader('Saving\u2026'); await apiWrite('Customers',newC); CUSTOMERS.push(newC); hideLoader();
  closeModal(); renderCustomers(); showToast('Customer added: '+name);
}


// ── INIT ──────────────────────────────────────────────────────────────────
async function loadAllData(){
  showLoader('Connecting to database…');
  try{
    await apiInit();
    showLoader('Loading referrals…');
    const refs=await apiRead('Referrals');
    REFERRALS=refs.map(function(r){return Object.assign({},r,{value:parseFloat(r.value)||0,secured:parseFloat(r.secured)||0,collected:parseFloat(r.collected)||0,incentivePaid:parseFloat(r.incentivePaid)||0});});
    showLoader('Loading sourcing…');
    const srcs=await apiRead('Sourcing');
    SOURCING=srcs.map(function(s){return Object.assign({},s,{value:parseFloat(s.value)||0});});
    showLoader('Loading overdues…');
    const dues=await apiRead('Dues');
    DUES=dues.map(function(d){return Object.assign({},d,{amount:parseFloat(d.amount)||0,settled:parseFloat(d.settled)||0});});
    showLoader('Loading contacts…');
    const rawContacts=await apiRead('Contacts');
    CONTACTS_RAW=rawContacts.map(function(c){return {company:String(c.company||''),name:String(c.name||''),phone:String(c.phone||''),email:String(c.email||'')};});
    showLoader('Loading stories…');
    STORIES=await apiRead('Stories');
    showLoader('Loading right of first match…');
    ROFM=await apiRead('ROFM');
    showLoader('Loading exhibitions…');
    EXHIBITIONS=await apiRead('Exhibitions');
    showLoader('Loading customer database…');
    const rawCust=await apiRead('Customers');
    CUSTOMERS=rawCust.map(function(c){return Object.assign({},c,{ratingPayment:parseFloat(c.ratingPayment)||0,ratingComm:parseFloat(c.ratingComm)||0,ratingProf:parseFloat(c.ratingProf)||0,ratingGrowth:parseFloat(c.ratingGrowth)||0,ratingOverall:parseFloat(c.ratingOverall)||0});});
    hideLoader();
    updateNotifDots();
    renderDashboard();
  }catch(err){
    showError('Could not connect to database. Check your internet connection.');
    console.error(err);
    hideLoader();
    updateNotifDots();
    renderDashboard();
  }
}
loadAllData();
</script>
